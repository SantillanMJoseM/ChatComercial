name: commercial-attention-platform
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cap}
      POSTGRES_DB: ${POSTGRES_DB:-cap}
    volumes:
      - cap_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cap} -d ${POSTGRES_DB:-cap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: cap-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cap-api
    env_file: .env
    volumes:
      - cap_knowledge_storage:/data/knowledge
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cap}:${POSTGRES_PASSWORD:-cap}@postgres:5432/${POSTGRES_DB:-cap}
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cap-web
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  waha:
    image: devlikeapro/waha:latest
    container_name: cap-waha
    profiles: ["integrations"]
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-devkey}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    ports:
      - "3002:3000"
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging

  cw-db:
    image: pgvector/pgvector:pg17
    container_name: cap-cw-db
    profiles: ["integrations"]
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DB: chatwoot
    volumes:
      - cap_cw_pg_data:/var/lib/postgresql/data
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging

  cw-redis:
    image: redis:7-alpine
    container_name: cap-cw-redis
    profiles: ["integrations"]
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging

  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: cap-chatwoot
    profiles: ["integrations"]
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-}
      POSTGRES_HOST: cap-cw-db
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: chatwoot
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://cap-cw-redis:6379
      FRONTEND_URL: http://localhost:3011
      RAILS_LOG_TO_STDOUT: "true"
    ports:
      - "3011:3000"
    depends_on: [cw-db, cw-redis]
    networks: [capnet]
    restart: unless-stopped
    logging: *default-logging

networks:
  capnet:
    name: capnet
    driver: bridge

volumes:
  cap_pg_data:
  cap_knowledge_storage:
  cap_redis_data:
  cap_cw_pg_data:
