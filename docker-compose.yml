name: commercial-attention-platform
services:
  postgres:
    image: postgres:17-alpine
    container_name: cap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cap}
      POSTGRES_DB: ${POSTGRES_DB:-cap}
    volumes:
      - cap_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cap} -d ${POSTGRES_DB:-cap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: cap-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cap-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cap}:${POSTGRES_PASSWORD:-cap}@postgres:5432/${POSTGRES_DB:-cap}
      REDIS_URL: redis://redis:6379
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cap-web
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3010}:3010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [capnet]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  capnet:
    name: capnet
    driver: bridge

volumes:
  cap_pg_data:
  cap_redis_data:
